name: Build and publish Control Center

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish single-file application
        shell: pwsh
        run: |
          $project = 'src/TRPOLARIS.NFSU2.WebControlCenter/TRPOLARIS.NFSU2.WebControlCenter.csproj'
          dotnet restore $project -r win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }
          dotnet publish $project -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o publish
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed.' }

      - name: Create SHA-256 manifest
        id: manifest
        shell: pwsh
        run: |
          $exe = 'publish/TRPOLARIS.NFSU2.WebControlCenter.exe'
          if (-not (Test-Path $exe)) { throw 'Published EXE not found.' }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($env:GITHUB_REF_TYPE -ne 'tag') { throw 'Workflow must run from a v* tag to create a release.' }
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')
          [xml]$projectXml = Get-Content 'src/TRPOLARIS.NFSU2.WebControlCenter/TRPOLARIS.NFSU2.WebControlCenter.csproj'
          $projectVersion = [string]$projectXml.Project.PropertyGroup.Version
          if ($projectVersion -ne $version) {
            throw "Git tag version ($version) does not match project version ($projectVersion). Update the csproj before tagging."
          }
          $manifest = [ordered]@{
            product = 'TRPOLARIS NFSU2 Web Control Center'
            version = $version
            tag = $tag
            asset = 'TRPOLARIS.NFSU2.WebControlCenter.exe'
            sha256 = $hash
            architecture = 'win-x64'
            publishedAt = (Get-Date).ToUniversalTime().ToString('o')
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content 'publish/latest.json' -Encoding UTF8
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "asset=publish/TRPOLARIS.NFSU2.WebControlCenter.exe" >> $env:GITHUB_OUTPUT

      - name: Validate versioned release notes
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = ".github/release-notes/$tag.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "Versioned release notes are missing: $notes"
          }
          if ((Get-Item -LiteralPath $notes).Length -eq 0) {
            throw "Versioned release notes are empty: $notes"
          }

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: TRPOLARIS Control Center ${{ steps.manifest.outputs.tag }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: |
            publish/TRPOLARIS.NFSU2.WebControlCenter.exe
            publish/latest.json
