name: Build and publish NFSU2 Server control

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore and publish single-file executable
        shell: pwsh
        run: |
          $project = 'src/TRPOLARIS.NFSU2.WebControlCenter/TRPOLARIS.NFSU2.WebControlCenter.csproj'
          dotnet restore $project -r win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }

          dotnet publish $project -c Release -r win-x64 --self-contained true -o publish
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed.' }

          $exe = 'publish/NFSU2 Server control.exe'
          if (-not (Test-Path $exe)) { throw 'Published executable not found.' }

          $sidecarScripts = @(Get-ChildItem 'publish' -Recurse -File -Filter '*.ps1')
          if ($sidecarScripts.Count -gt 0) {
            $sidecarScripts | ForEach-Object { Write-Error "Unexpected external script: $($_.FullName)" }
            throw 'The single-file release must not contain external PowerShell sidecars.'
          }

      - name: Validate release version and collect package metadata
        id: assets
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -ne 'tag') { throw 'Release workflow requires a Git tag.' }
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')

          [xml]$projectXml = Get-Content 'src/TRPOLARIS.NFSU2.WebControlCenter/TRPOLARIS.NFSU2.WebControlCenter.csproj'
          $projectVersion = [string]$projectXml.Project.PropertyGroup.Version
          if ($projectVersion -ne $version) {
            throw "Git tag version ($version) does not match project version ($projectVersion)."
          }

          $exe = 'publish/NFSU2 Server control.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath $exe).Length
          $channel = if ($version -match '-') { 'beta' } else { 'stable' }
          $publishedAt = (Get-Date).ToUniversalTime().ToString('o')
          $minimumSupportedVersion = '1.8.1'

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "size=$size" >> $env:GITHUB_OUTPUT
          "publishedAt=$publishedAt" >> $env:GITHUB_OUTPUT
          "minimumSupportedVersion=$minimumSupportedVersion" >> $env:GITHUB_OUTPUT

      - name: Sign update manifest
        shell: pwsh
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_SIGNING_PRIVATE_KEY)) {
            throw @'
          Missing required GitHub Actions secret: UPDATE_SIGNING_PRIVATE_KEY

          Create a repository Actions secret with this exact name:
            Get-Content -Raw .\\UPDATE_SIGNING_PRIVATE_KEY.pem | gh secret set UPDATE_SIGNING_PRIVATE_KEY --repo trpolaris/TRPOLARIS-NFSU2-Web-Control-Center

          The secret must contain the complete RSA PEM private key. Do not commit the PEM file.
          '@
          }

          $version = '${{ steps.assets.outputs.version }}'
          $tag = '${{ steps.assets.outputs.tag }}'
          $channel = '${{ steps.assets.outputs.channel }}'
          $publishedAt = '${{ steps.assets.outputs.publishedAt }}'
          $minimumSupportedVersion = '${{ steps.assets.outputs.minimumSupportedVersion }}'
          $sha256 = '${{ steps.assets.outputs.sha256 }}'
          $assetSize = [long]'${{ steps.assets.outputs.size }}'
          $assetName = 'NFSU2 Server control.exe'
          $product = 'NFSU2 Server control'
          $platform = 'win-x64'
          $signatureAlgorithm = 'RSA-SHA256'
          $keyId = 'f58f0a93a19ca147'

          $signingPayload = @(
            '2'
            $product
            $channel
            $version
            $tag
            $platform
            $assetName
            $assetSize.ToString([Globalization.CultureInfo]::InvariantCulture)
            $sha256.ToLowerInvariant()
            $minimumSupportedVersion
            $publishedAt
            $signatureAlgorithm
            $keyId
          ) -join "`n"

          $rsa = [System.Security.Cryptography.RSA]::Create()
          try {
            $rsa.ImportFromPem($env:UPDATE_SIGNING_PRIVATE_KEY)

            # Ensure the secret is the private half of the public key embedded in UpdateEngine.cs.
            $publicBase64 = [Convert]::ToBase64String($rsa.ExportSubjectPublicKeyInfo())
            $publicLines = for ($i = 0; $i -lt $publicBase64.Length; $i += 64) {
              $publicBase64.Substring($i, [Math]::Min(64, $publicBase64.Length - $i))
            }
            $canonicalPublicPem = "-----BEGIN PUBLIC KEY-----`n" + ($publicLines -join "`n") + "`n-----END PUBLIC KEY-----`n"
            $actualKeyId = [Convert]::ToHexString(
              [System.Security.Cryptography.SHA256]::HashData(
                [System.Text.Encoding]::UTF8.GetBytes($canonicalPublicPem)
              )
            ).ToLowerInvariant().Substring(0, 16)
            if ($actualKeyId -ne $keyId) {
              throw "UPDATE_SIGNING_PRIVATE_KEY does not match the public key embedded in the application. Expected key ID $keyId; got $actualKeyId."
            }

            $signature = $rsa.SignData(
              [System.Text.Encoding]::UTF8.GetBytes($signingPayload),
              [System.Security.Cryptography.HashAlgorithmName]::SHA256,
              [System.Security.Cryptography.RSASignaturePadding]::Pkcs1
            )
          }
          finally {
            $rsa.Dispose()
            $env:UPDATE_SIGNING_PRIVATE_KEY = ''
          }

          $manifest = [ordered]@{
            schemaVersion = 2
            product = $product
            channel = $channel
            version = $version
            tag = $tag
            platform = $platform
            assetName = $assetName
            assetSize = $assetSize
            sha256 = $sha256
            minimumSupportedVersion = $minimumSupportedVersion
            publishedAt = $publishedAt
            signatureAlgorithm = $signatureAlgorithm
            keyId = $keyId
            signature = [Convert]::ToBase64String($signature)
          }

          $manifest | ConvertTo-Json -Depth 6 | Set-Content 'publish/update-manifest.json' -Encoding utf8

      - name: Validate versioned release notes
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = ".github/release-notes/$tag.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "Versioned release notes are missing: $notes"
          }
          if ((Get-Item -LiteralPath $notes).Length -eq 0) {
            throw "Versioned release notes are empty: $notes"
          }

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: NFSU2 Server control ${{ steps.assets.outputs.tag }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          prerelease: ${{ steps.assets.outputs.channel == 'beta' }}
          make_latest: ${{ steps.assets.outputs.channel == 'stable' }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            publish/NFSU2 Server control.exe
            publish/update-manifest.json
