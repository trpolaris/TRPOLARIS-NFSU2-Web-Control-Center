name: Verify NFSU2 Server control Build

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-control-center.yml'
      - 'src/TRPOLARIS.NFSU2.WebControlCenter/**'
  pull_request:
    paths:
      - '.github/workflows/verify-control-center.yml'
      - 'src/TRPOLARIS.NFSU2.WebControlCenter/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-installer-bash:
    name: Validate embedded WSL Bash installer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract and syntax-check the embedded Bash script
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          source = pathlib.Path(
              "src/TRPOLARIS.NFSU2.WebControlCenter/Resources/NFSU2-Windows-OneClick-Installer.ps1"
          ).read_text(encoding="utf-8")
          matches = re.findall(
              r"(?ms)^[ \t]*\$BashScript[ \t]*=[ \t]*@'\r?\n(.*?)^[ \t]*'@[ \t]*$",
              source,
          )
          if len(matches) != 1:
              raise SystemExit(f"Expected one embedded Bash here-string, found {len(matches)}")
          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "nfsu2-one-click-wsl.sh"
          bash_script = matches[0].replace("\r\n", "\n")
          required = (
              "fetch --unshallow origin main",
              "merge --ff-only FETCH_HEAD",
              "diff --quiet --",
          )
          missing = [needle for needle in required if needle not in bash_script]
          if missing:
              raise SystemExit(f"Existing-checkout refresh safeguards are missing: {missing}")
          target.write_text(bash_script, encoding="utf-8")
          print(f"Extracted {len(bash_script.splitlines())} embedded Bash lines to {target}")
          PY
          bash -n "$RUNNER_TEMP/nfsu2-one-click-wsl.sh"
          bash -n 'src/TRPOLARIS.NFSU2.WebControlCenter/Resources/nfsu2-project-lookup.sh'
          bash .github/verify-project-lookup.sh
          bash .github/verify-checkout-refresh.sh "$RUNNER_TEMP/nfsu2-one-click-wsl.sh"
          python3 - <<'PY'
          from pathlib import Path
          source = Path("src/TRPOLARIS.NFSU2.WebControlCenter/Resources/NFSU2-Windows-OneClick-Installer.ps1").read_text(encoding="utf-8")
          forbidden = "find . -type f -name '*.sh' -exec chmod u+x {} +"
          if forbidden in source:
              raise SystemExit("Installer must not mass-chmod tracked shell files.")
          if "generated_script_modes" not in source or "generated_docker_files" not in source:
              raise SystemExit("Safe recovery for older installer-generated Git changes is missing.")
          source_lines = source.splitlines()
          recovery_start = next(i for i, line in enumerate(source_lines) if "update_existing_checkout() {" in line)
          recovery_end = next(i for i in range(recovery_start + 1, len(source_lines)) if source_lines[i].strip() == 'if [[ -d "$PROJECT" ]]; then')
          recovery = "\n".join(source_lines[recovery_start:recovery_end])
          if r"\${" in recovery:
              raise SystemExit("Updater contains escaped shell variable expansions.")
          if "validated without modifying tracked files" not in source:
              raise SystemExit("Docker source validation must be read-only.")
          print("PASS: installer no longer self-dirties tracked source files.")
          PY

          python3 - <<'PY'
          from pathlib import Path

          root = Path("src/TRPOLARIS.NFSU2.WebControlCenter")
          ssh = (root / "RemoteServerSession.cs").read_text(encoding="utf-8")
          remote_page = (root / "RemoteServerPage.cs").read_text(encoding="utf-8")
          app = (root / "App.xaml").read_text(encoding="utf-8")
          installer = (root / "Resources/NFSU2-Windows-OneClick-Installer.ps1").read_text(encoding="utf-8")
          main = (root / "MainWindow.xaml.cs").read_text(encoding="utf-8")

          assert 'Replace("\\r\\n", "\\n", StringComparison.Ordinal)' in ssh, "SSH command transport must normalize CRLF to LF."
          assert remote_page.count('Style = (Style)FindResource("DarkComboBox")') >= 4, "All remote page ComboBoxes must use the dark template."
          assert 'x:Key="DarkComboBox"' in app, "Dark ComboBox template is missing."
          assert 'if ($null -eq $dockerProbeLine)' in installer, "Docker readiness probe must handle empty output."
          assert '$DockerProbeDetail' in installer, "Docker readiness failure must retain diagnostic output."
          assert 'bool dockerEngineReady = false;' in main, "Uninstall must probe Docker Engine before container cleanup."
          assert 'containerQueryFailed' in main, "Uninstall must distinguish query failures from an absent container."
          assert 'Docker CLI bulundu ancak Docker Engine yanıt vermiyor' in main, "Docker diagnostics must report engine unavailability."
          print("PASS: SSH LF normalization, dark remote selectors, and Docker Engine safety checks.")
          PY

          python3 - <<'PY'
          from pathlib import Path
          root = Path("src/TRPOLARIS.NFSU2.WebControlCenter")
          remote = (root / "RemoteServerPage.cs").read_text(encoding="utf-8")
          deploy = (root / "RemoteDeploymentPage.cs").read_text(encoding="utf-8")
          profile = (root / "RemoteServerProfile.cs").read_text(encoding="utf-8")
          window = (root / "MainWindow.xaml").read_text(encoding="utf-8")
          main = (root / "MainWindow.xaml.cs").read_text(encoding="utf-8")
          app = (root / "App.xaml").read_text(encoding="utf-8")

          assert 'public string AccessMode { get; set; } = "domain";' in profile
          for value in ('"lan"', '"public-ip"', '"domain"'):
              assert value in remote, f"Remote access mode {value} is missing."
          for token in ('tls internal', 'profile shortlived', 'bind ', '--cacert', 'api.ipify.org'):
              assert token in deploy, f"Secure endpoint implementation missing: {token}"
          assert 'DownloadRemoteLanCertificateAsync' in remote
          assert 'DownloadRemoteFileAsync(root + "/lan-ca-root.crt"' in deploy
          assert 'BuildRemoteDeploymentPage' in remote and 'BuildRemoteFilesPage' in remote
          assert 'Nightshift Garage' in app, "The shared control theme must use the Nightshift Garage design system."
          for name in (
              'WindowTitleBar', 'NavDashboard', 'NavInstall', 'NavUpdate', 'NavAccess', 'NavFiles',
              'NavRemote', 'NavRemoteDeploy', 'NavRemoteFiles', 'NavUninstall', 'NavLogs',
              'PageHost', 'OperationProgressPanel', 'OperationProgressBar', 'FooterStatus'
          ):
              assert f'x:Name="{name}"' in window, f"Required WPF shell element was removed: {name}"
          assert 'SSH bağlantıları' in window and 'Uzak dağıtım' in window and 'Uzak dosya yöneticisi' in window
          print("PASS: LAN/public-IP/domain TLS modes, dedicated remote pages, and redesigned navigation.")
          PY

          python3 - <<'PY'
          from pathlib import Path
          root = Path("src/TRPOLARIS.NFSU2.WebControlCenter")
          file_manager = (root / "RemoteFileManagerPage.cs").read_text(encoding="utf-8")
          remote = (root / "RemoteServerPage.cs").read_text(encoding="utf-8")
          deploy = (root / "RemoteDeploymentPage.cs").read_text(encoding="utf-8")
          session = (root / "RemoteServerSession.cs").read_text(encoding="utf-8")
          profile = (root / "RemoteServerProfile.cs").read_text(encoding="utf-8")
          app = (root / "App.xaml").read_text(encoding="utf-8")
          window = (root / "MainWindow.xaml").read_text(encoding="utf-8")
          main = (root / "MainWindow.xaml.cs").read_text(encoding="utf-8")

          assert 'BuildRemoteFileManagerAccessCheck(root)' in file_manager
          assert 'BuildRemoteFileManagerWriteCheck(root)' in file_manager
          assert 'BuildRemoteOwnershipCheck(root)' not in file_manager, "Legacy SFTP browser must not require the Docker deployment marker."
          assert 'DownloadRemoteFileAsync(remotePath, dialog.FileName)' in file_manager
          assert 'READ_ONLY' in deploy and 'WRITE_DENIED' in deploy
          assert 'if [ ! -w {rootPath} ]' in deploy, "Write operations must check actual SSH-user directory permissions."
          assert 'BuildRemoteFileManagerClaimCommand(root)' in remote
          assert '.nfsu2-control-center-sftp-root' in deploy and '.nfsu2-control-center-sftp-root' in session
          assert 'public string RemoteFileManagerRoot { get; set; }' in profile
          assert 'RemoteFileManagerRoot = selected?.RemoteFileManagerRoot ?? ""' in remote
          assert 'Kökü aç' in remote and 'Bu dizini SFTP için etkinleştir' in remote
          assert 'if [ -w ' in deploy, "SFTP marker creation should use the SSH account when it owns the directory before trying sudo."
          assert '<Setter Property="MinHeight" Value="38" />' in app, "Compact text/password fields must use the 38 px control rhythm."
          assert '<Setter Property="MinHeight" Value="38" />' in app, "Compact primary buttons must use the 38 px control rhythm."
          assert 'x:Name="PageHost"' in window
          assert 'Width="1280" Height="820"' in window, "The main window should use compact dimensions."
          assert "SSH KOMUT PENCERESİ" in remote and "RunRemoteSshCommandAsync" in remote
          assert "ProtectedPassword" in profile and "ProtectedKeyPassphrase" in profile
          assert "RemoteSecretProtector" in remote and "CryptProtectData" in profile
          assert "VerticalContentAlignment = VerticalAlignment.Top" in main
          print("PASS: legacy SFTP read-only browsing, explicit SFTP adoption, write ACL checks and Nightshift Garage interface.")
          PY

  build-win-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate embedded installer PowerShell syntax
        shell: pwsh
        run: |
          $script = 'src/TRPOLARIS.NFSU2.WebControlCenter/Resources/NFSU2-Windows-OneClick-Installer.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List *
            throw "PowerShell syntax validation failed: $script"
          }

      - name: Restore
        shell: pwsh
        run: |
          $project = 'src/TRPOLARIS.NFSU2.WebControlCenter/TRPOLARIS.NFSU2.WebControlCenter.csproj'
          dotnet restore $project -r win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }

      - name: Publish native single-file application
        shell: pwsh
        run: |
          $project = 'src/TRPOLARIS.NFSU2.WebControlCenter/TRPOLARIS.NFSU2.WebControlCenter.csproj'
          dotnet publish $project -c Release -r win-x64 --self-contained true -o publish
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed.' }

          $exe = 'publish/NFSU2 Server control.exe'
          if (-not (Test-Path $exe)) { throw 'Published NFSU2 Server control executable not found.' }

          $sidecarScripts = @(Get-ChildItem 'publish' -Recurse -File -Filter '*.ps1')
          if ($sidecarScripts.Count -gt 0) {
            $sidecarScripts | ForEach-Object { Write-Error "Unexpected external script: $($_.FullName)" }
            throw 'Runtime updater/installer scripts must not be published as sidecar files.'
          }

          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "EXE=$exe"
          "SHA256=$hash"
          "SIZE=$((Get-Item $exe).Length)"

      - name: Upload single-file executable
        uses: actions/upload-artifact@v4
        with:
          name: NFSU2-Server-control-v2.0-win-x64
          path: publish/NFSU2 Server control.exe
          if-no-files-found: error
          retention-days: 30
