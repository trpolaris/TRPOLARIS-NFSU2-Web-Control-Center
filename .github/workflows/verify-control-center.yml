name: Verify NFSU2 Server control Build

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-control-center.yml'
      - 'src/TRPOLARIS.NFSU2.WebControlCenter/**'
  pull_request:
    paths:
      - '.github/workflows/verify-control-center.yml'
      - 'src/TRPOLARIS.NFSU2.WebControlCenter/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-installer-bash:
    name: Validate embedded WSL Bash installer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract and syntax-check the embedded Bash script
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          source = pathlib.Path(
              "src/TRPOLARIS.NFSU2.WebControlCenter/Resources/NFSU2-Windows-OneClick-Installer.ps1"
          ).read_text(encoding="utf-8")
          matches = re.findall(
              r"(?ms)^[ \\t]*\\$BashScript[ \\t]*=[ \\t]*@'\\r?\\n(.*?)^[ \\t]*'@[ \\t]*$",
              source,
          )
          if len(matches) != 1:
              raise SystemExit(f"Expected one embedded Bash here-string, found {len(matches)}")
          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "nfsu2-one-click-wsl.sh"
          target.write_text(matches[0].replace("\\r\\n", "\\n"), encoding="utf-8")
          print(f"Extracted {len(matches[0].splitlines())} embedded Bash lines to {target}")
          PY
          bash -n "$RUNNER_TEMP/nfsu2-one-click-wsl.sh"

  build-win-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate embedded installer PowerShell syntax
        shell: pwsh
        run: |
          $script = 'src/TRPOLARIS.NFSU2.WebControlCenter/Resources/NFSU2-Windows-OneClick-Installer.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List *
            throw "PowerShell syntax validation failed: $script"
          }

      - name: Restore
        shell: pwsh
        run: |
          $project = 'src/TRPOLARIS.NFSU2.WebControlCenter/TRPOLARIS.NFSU2.WebControlCenter.csproj'
          dotnet restore $project -r win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }

      - name: Publish native single-file application
        shell: pwsh
        run: |
          $project = 'src/TRPOLARIS.NFSU2.WebControlCenter/TRPOLARIS.NFSU2.WebControlCenter.csproj'
          dotnet publish $project -c Release -r win-x64 --self-contained true -o publish
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed.' }

          $exe = 'publish/NFSU2 Server control.exe'
          if (-not (Test-Path $exe)) { throw 'Published NFSU2 Server control executable not found.' }

          $sidecarScripts = @(Get-ChildItem 'publish' -Recurse -File -Filter '*.ps1')
          if ($sidecarScripts.Count -gt 0) {
            $sidecarScripts | ForEach-Object { Write-Error "Unexpected external script: $($_.FullName)" }
            throw 'Runtime updater/installer scripts must not be published as sidecar files.'
          }

          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "EXE=$exe"
          "SHA256=$hash"
          "SIZE=$((Get-Item $exe).Length)"

      - name: Upload single-file executable
        uses: actions/upload-artifact@v4
        with:
          name: NFSU2-Server-control-v1.8.1-win-x64
          path: publish/NFSU2 Server control.exe
          if-no-files-found: error
          retention-days: 30
